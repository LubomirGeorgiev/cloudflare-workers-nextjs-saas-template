on:
  push:
    branches:
      - main

# The three check jobs run side by side; the deploy job waits for all of them.
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Lint, typecheck, and unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup

      # The pinned local oxlint must run: the anti-slop plugin imports @oxlint/plugins at that exact version.
      # TODO: When Oxc ships its own tsrs lint backend (oxc-project/tsrs#378), replace @maschwenk/tsrslint
      # with it and update OXLINT_TSGOLINT_PATH in the package.json lint scripts.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Integration tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Integration tests
        run: pnpm run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: End-to-end tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Expose public GitHub variables
        env:
          GITHUB_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: node scripts/expose-public-github-variables.mjs

      # Keyed on the Playwright version, not the lockfile, so other dependency bumps keep the browser.
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ steps.playwright-version.outputs.version }}

      # `chromium.launch({ headless: true })` runs the headless shell, so the full browser is not needed.
      - name: Install Playwright Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --only-shell chromium

      # The runner image already has every library the shell links, and a slow apt mirror once stalled
      # this job for 12 minutes. So apt runs only when a library is missing, and with a time limit.
      - name: Check Chromium system libraries
        timeout-minutes: 5
        run: |
          shell="$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell | head -n 1)"
          if [ -z "$shell" ]; then
            echo "::error::The Chromium headless shell is not in ~/.cache/ms-playwright."
            exit 1
          fi
          if ldd "$shell" | grep -q "not found"; then
            ldd "$shell" | grep "not found"
            pnpm exec playwright install-deps chromium
          else
            echo "Every library that $shell links is present."
          fi

      - name: End-to-end tests
        run: pnpm run test:e2e

      # The deploy job ships this build. `.wrangler/deploy/config.json` points Wrangler at `dist/server/`.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: vinext-build
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [static-checks, integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Set D1 environment variables
        id: set-d1-vars
        run: |
          echo "D1_DATABASE_NAME=$(node scripts/get-db-name.mjs)" >> "$GITHUB_ENV"

      - name: Expose public GitHub variables
        env:
          GITHUB_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: node scripts/expose-public-github-variables.mjs

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: vinext-build

      - name: Deploy
        run: |
          set -o pipefail
          pnpm run deploy --skip-build 2>&1 | tee deploy-output.log
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run DB migrations
        run: pnpm wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Purge Cloudflare CDN cache
        uses: actions/github-script@v9
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const apiToken = process.env.CLOUDFLARE_API_TOKEN;

            if (!apiToken) {
              core.setFailed("CLOUDFLARE_API_TOKEN is required");
              return;
            }

            const { resolveDeployedSiteUrl, resolveDeployZoneId } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/utils/deploy-site-url.mjs`).href
            );
            const { zoneId, noZone, problem } = await resolveDeployZoneId({
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken,
              configuredZoneId: process.env.CLOUDFLARE_ZONE_ID,
              siteUrl: resolveDeployedSiteUrl(),
            });

            // A custom domain without a purge keeps serving old pages, so fail the deploy.
            if (problem) {
              core.setFailed(`${problem} Set CLOUDFLARE_ZONE_ID, or check the custom domain and the Workers Scripts Read permission of the token.`);
              return;
            }

            if (!zoneId) {
              core.warning(`${noZone} Skipping the purge.`);
              return;
            }

            const response = await fetch(
              `https://api.cloudflare.com/client/v4/zones/${zoneId}/purge_cache`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${apiToken}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ purge_everything: true }),
              }
            );

            const body = await response.text();
            const result = body ? JSON.parse(body) : {};

            if (!response.ok || !result.success) {
              const errors = Array.isArray(result.errors)
                ? result.errors.map((error) => error.message).filter(Boolean)
                : [];
              const reason = errors.length > 0 ? errors.join("; ") : response.statusText;

              core.setFailed(`Cloudflare cache purge failed: ${reason}`);
              return;
            }

            const purgeId = result.result?.id;
            core.info(
              purgeId
                ? `Cloudflare CDN cache purge requested: ${purgeId}`
                : "Cloudflare CDN cache purge requested"
            );

      # Diagnostics, never a deploy gate: profiling reuses the build the e2e job produced.
      - name: Profile Worker startup
        id: startup-profile
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec wrangler check startup -c dist/server/wrangler.json 2>&1 | tee startup-profile-output.log
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Diagnostics, never a deploy gate: measures the deploy that just went live.
      - name: Measure TTFB
        id: measure-ttfb
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/measure-ttfb.mjs 2>&1 | tee ttfb-output.log

      # One row per deploy: sizes always, startup timings and TTFB when the steps above succeeded.
      - name: Capture deploy metrics
        run: node scripts/record-metrics.mjs deploy-output.log startup-profile-output.log ttfb-output.log

      - name: Commit metrics
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
            exit 0
          fi
          git commit -m "chore: record deploy metrics [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
